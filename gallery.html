<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — DarrMilly</title>
    <meta name="description" content="DarrMilly Gallery by Maria Dunn — Explore themes of dedications, anniversary, love, encouragement, pain, farewell, faith, rest in peace, and grief.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F6EFE6;
            font-family: 'Lora', serif;
            color: #7A1212;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        .wave-banner {
            position: relative;
            width: 100%;
            max-width: 900px;
            min-height: 195px;
            background-image: url("banner-ola.png");
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 24px 42px;
        }

        .banner-content {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .banner-tagline {
            max-width: 780px;
            color: #E3B64E;
            font-size: clamp(1.1rem, 2.3vw, 1.65rem);
            font-weight: 500;
            line-height: 1.3;
            text-wrap: balance;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .banner-bottom-row {
            position: relative;
            width: 100%;
            max-width: 760px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 76px;
        }

        .banner-logo {
            width: 74px;
            max-width: 24%;
            height: auto;
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
        }

        .banner-brand {
            position: absolute;
            right: 8px;
            color: #E3B64E;
            font-size: clamp(0.92rem, 1.7vw, 1.2rem);
            font-weight: 400;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .top-controls-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px 24px 10px;
        }

        .back-home-btn {
            display: inline-block;
            text-decoration: none;
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 5px 16px;
            border-radius: 999px;
            border: 1.5px solid #7A1212;
            background-color: transparent;
            color: #7A1212;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .back-home-btn:hover,
        .back-home-btn:active {
            background-color: #7A1212;
            color: #E3B64E;
        }

        .lang-bar {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        .lang-btn {
            font-family: 'Lora', serif;
            font-size: 0.92rem;
            padding: 5px 15px;
            border-radius: 999px;
            border: 1.5px solid #7A1212;
            background-color: transparent;
            color: #7A1212;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .lang-btn.active,
        .lang-btn:hover,
        .lang-btn:active {
            background-color: #7A1212;
            color: #E2B857;
        }

        .main-content {
            width: 100%;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 20px 48px;
        }

        .gallery-view {
            width: 100%;
            max-width: 720px;
            padding: 12px 10px 24px;
            text-align: center;
        }

        .gallery-title {
            font-size: clamp(1.55rem, 3.2vw, 2.1rem);
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #7A1212;
            margin-bottom: 22px;
        }

        .themes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .theme-button {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 10px 16px;
            border-radius: 999px;
            background-color: #FFFDF9;
            border: 1.5px solid #C9963B;
            box-shadow: 0 2px 6px rgba(122, 18, 18, 0.06);
            color: #7A1212;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-button:hover {
            background-color: #FBF3E4;
            border-color: #7A1212;
            transform: translateY(-1px);
        }

        .theme-button:active,
        .theme-button.pressed {
            background-color: #7A1212;
            color: #E3B64E;
            border-color: #C9963B;
            transform: scale(0.98);
        }

        .contact-mail {
            margin-top: 24px;
            font-size: 0.9rem;
            text-align: center;
        }

        .contact-mail a {
            color: #7A1212;
            text-decoration: none;
            border-bottom: 1px solid #C9963B;
        }

        @media (max-width: 650px) {
            .wave-banner {
                min-height: 160px;
                padding: 16px 14px 28px;
            }

            .banner-tagline {
                font-size: 1.02rem;
            }

            .banner-bottom-row {
                min-height: 62px;
            }

            .banner-brand {
                position: static;
                margin-left: 12px;
                font-size: 0.92rem;
                letter-spacing: 1.5px;
            }

            .banner-logo {
                width: 58px;
            }

            .top-controls-bar {
                justify-content: space-between;
                align-items: center;
                padding: 10px 14px 6px;
                gap: 8px;
            }

            .lang-bar {
                gap: 6px;
                margin-left: auto;
            }

            .back-home-btn,
            .lang-btn {
                font-size: 0.8rem;
                padding: 4px 10px;
            }

            .main-content {
                padding: 12px 14px 36px;
            }

            .themes-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .theme-button {
                font-size: 0.92rem;
                min-height: 46px;
            }
        }
    </style>
</head>
<body>

    <header class="wave-banner">
        <div class="banner-content">
            <p class="banner-tagline" id="bannerTagline">Starting again without erasing what was lived.</p>
            <div class="banner-bottom-row">
                <img src="logo-dm.png" alt="Logo DM" class="banner-logo">
                <p class="banner-brand">DARRMILLY</p>
            </div>
        </div>
    </header>

    <div class="top-controls-bar">
        <a href="index.html" id="backHomeBtn" class="back-home-btn">← Back</a>

        <div class="lang-bar" role="group" aria-label="Language switcher">
            <button type="button" id="btnEn" class="lang-btn active" onclick="cambiarIdioma('en')">English</button>
            <button type="button" id="btnEs" class="lang-btn" onclick="cambiarIdioma('es')">Español</button>
        </div>
    </div>

    <main class="main-content">
        <section class="gallery-view" id="galleryView" aria-labelledby="galleryTitle">
            <h1 class="gallery-title" id="galleryTitle">GALLERY</h1>

            <nav class="themes-grid" aria-label="Quote themes">
                <a href="dedicatorias.html" class="theme-button" data-en="Dedications" data-es="Dedicatorias">Dedications</a>
                <a href="aniversario.html" class="theme-button" data-en="Anniversary" data-es="Aniversario">Anniversary</a>
                <a href="amor.html" class="theme-button" data-en="Love" data-es="Amor">Love</a>
                <a href="motivacion.html" class="theme-button" data-en="Encouragement" data-es="Motivación">Encouragement</a>
                <a href="dolor.html" class="theme-button" data-en="Pain" data-es="Dolor">Pain</a>
                <a href="despedida.html" class="theme-button" data-en="Farewell" data-es="Despedida">Farewell</a>
                <a href="fe.html" class="theme-button" data-en="Faith" data-es="Fe">Faith</a>
                <a href="descansa-en-paz.html" class="theme-button" data-en="Rest in Peace" data-es="Descansa en Paz">Rest in Peace</a>
                <a href="duelo.html" class="theme-button" data-en="Grief" data-es="Duelo">Grief</a>
            </nav>
        </section>

        <p class="contact-mail">
            <a href="mailto:darrmillyoficial@gmail.com">darrmillyoficial@gmail.com</a>
        </p>
    </main>

    <script>
        var i18n = {
            en: {
                lang: 'en',
                title: 'Gallery — DarrMilly',
                bannerTagline: 'Starting again without erasing what was lived.',
                backBtn: '← Back',
                galleryTitle: 'GALLERY'
            },
            es: {
                lang: 'es',
                title: 'Galería — DarrMilly',
                bannerTagline: 'Volver a empezar sin borrar lo vivido.',
                backBtn: '← Volver',
                galleryTitle: 'GALERÍA'
            }
        };

        function cambiarIdioma(lang) {
            var currentLang = (lang === 'es') ? 'es' : 'en';
            try {
                localStorage.setItem('darrmilly_lang', currentLang);
            } catch (e) {}

            var dict = i18n[currentLang];
            var esEspañol = (currentLang === 'es');

            document.documentElement.lang = dict.lang;
            document.title = dict.title;
            document.getElementById('bannerTagline').textContent = dict.bannerTagline;
            document.getElementById('backHomeBtn').textContent = dict.backBtn;
            document.getElementById('galleryTitle').textContent = dict.galleryTitle;

            document.querySelectorAll('.theme-button').forEach(function (btn) {
                var label = esEspañol ? btn.getAttribute('data-es') : btn.getAttribute('data-en');
                if (label) btn.textContent = label;
            });

            document.getElementById('btnEn').classList.toggle('active', !esEspañol);
            document.getElementById('btnEs').classList.toggle('active', esEspañol);
        }

        document.querySelectorAll('.theme-button').forEach(function (el) {
            el.addEventListener('pointerdown', function () {
                el.classList.add('pressed');
            });
            el.addEventListener('pointerup', function () {
                el.classList.remove('pressed');
            });
            el.addEventListener('pointerleave', function () {
                el.classList.remove('pressed');
            });
            el.addEventListener('pointercancel', function () {
                el.classList.remove('pressed');
            });
        });

        window.addEventListener('pageshow', function () {
            document.querySelectorAll('.pressed').forEach(function (el) {
                el.classList.remove('pressed');
            });
        });

        (function initLang() {
            var savedLang = 'en';
            try {
                savedLang = localStorage.getItem('darrmilly_lang') || 'en';
            } catch (e) {}
            cambiarIdioma(savedLang);
        })();
    </script>
</body>
</html>
