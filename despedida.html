<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darrmilly — Farewell</title>
    <meta name="description" content="Darrmilly — Farewell quotes in English and Spanish.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F6EFE6;
            font-family: 'Lora', serif;
            color: #7A1212;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .wave-banner {
            position: relative;
            width: 100%;
            max-width: 900px;
            min-height: 145px;
            background-image: url("banner-ola.png");
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 20px 28px;
        }

        .banner-logo-link {
            display: inline-block;
            text-decoration: none;
        }

        .banner-logo {
            width: 82px;
            height: auto;
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
        }

        .gallery-container {
            width: 100%;
            max-width: 820px;
            padding: 14px 24px 42px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .lang-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            margin-bottom: 6px;
        }

        .lang-btn {
            background: none;
            border: none;
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #7A1212;
            cursor: pointer;
            padding: 4px 6px;
            border-bottom: 2px solid transparent;
            transition: opacity 0.2s ease, border-color 0.2s ease;
        }

        .lang-btn:hover {
            opacity: 0.75;
        }

        .lang-btn.active {
            border-bottom-color: #C9963B;
        }

        .gallery-title {
            font-size: clamp(2rem, 4.5vw, 2.75rem);
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #7A1212;
            text-align: center;
            margin: 6px 0 32px;
            text-shadow: 2px 2px 0px rgba(212, 168, 79, 0.45);
        }

        .quotes-grid {
            width: 100%;
            max-width: 760px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 44px;
        }

        .quote-card {
            position: relative;
            background-color: #7A1212;
            border-radius: 14px;
            padding: 7px 12px;
            display: flex;
            align-items: stretch;
            justify-content: center;
            min-height: 92px;
            box-shadow: 0 4px 14px rgba(122, 18, 18, 0.08);
        }

        .quote-card::before,
        .quote-card::after {
            content: "";
            position: absolute;
            top: 7px;
            bottom: 7px;
            width: 7px;
            background: linear-gradient(180deg, #C79438 0%, #F1CF7A 50%, #B88228 100%);
        }

        .quote-card::before {
            left: 4px;
            border-radius: 8px 0 0 8px;
        }

        .quote-card::after {
            right: 4px;
            border-radius: 0 8px 8px 0;
        }

        .quote-inner {
            background-color: #F6EFE6;
            border-radius: 10px;
            width: 100%;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .quote-text {
            font-size: 1.02rem;
            font-weight: 600;
            line-height: 1.45;
            color: #7A1212;
            white-space: pre-line;
        }

        .quote-image {
            max-width: 100%;
            max-height: 180px;
            border-radius: 6px;
            display: block;
        }

        .gallery-footer {
            text-align: center;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #7A1212;
            margin-top: auto;
            padding-top: 12px;
        }

        @media (max-width: 700px) {
            .wave-banner {
                min-height: 115px;
                padding: 14px 16px 20px;
            }

            .banner-logo {
                width: 68px;
            }

            .gallery-container {
                padding: 12px 18px 34px;
            }

            .lang-bar {
                justify-content: center;
                margin-bottom: 10px;
            }

            .gallery-title {
                margin: 4px 0 24px;
            }

            .quotes-grid {
                gap: 16px;
                margin-bottom: 34px;
            }

            .quote-card {
                min-height: 82px;
            }

            .quote-inner {
                padding: 12px 16px;
            }

            .quote-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <header class="wave-banner">
        <a href="index.html" class="banner-logo-link" title="Back to Home">
            <img src="logo-dm.png" alt="Logo DM" class="banner-logo">
        </a>
    </header>

    <main class="gallery-container">
        <div class="lang-bar" role="group" aria-label="Language switcher">
            <button type="button" id="btnEn" class="lang-btn active" onclick="cambiarIdioma('en')">English</button>
            <button type="button" id="btnEs" class="lang-btn" onclick="cambiarIdioma('es')">Español</button>
        </div>

        <h1 class="gallery-title" id="galleryTitle">FAREWELL</h1>

        <section class="quotes-grid" id="quotesGrid" aria-live="polite"></section>

        <footer class="gallery-footer" id="footerCopy">
            ALL RIGHTS RESERVED / 2026
        </footer>
    </main>

    <script src="frases.js"></script>
    <script>
        var idiomaActual = 'en';

        try {
            var guardado = localStorage.getItem('darrmilly_lang');
            if (guardado === 'es' || guardado === 'en') {
                idiomaActual = guardado;
            }
        } catch (e) {}

        function renderizarDespedida() {
            var base = (typeof misFrases !== 'undefined') ? misFrases : [];
            var lista = base.filter(function(item) {
                return (item.tema || '').toLowerCase() === 'despedida';
            });

            var grid = document.getElementById('quotesGrid');
            grid.innerHTML = '';

            lista.forEach(function(item) {
                var card = document.createElement('article');
                card.className = 'quote-card';

                var inner = document.createElement('div');
                inner.className = 'quote-inner';

                if (item.imagen) {
                    var img = document.createElement('img');
                    img.src = item.imagen;
                    img.alt = (idiomaActual === 'es' ? item.es : item.en) || 'Darrmilly farewell quote';
                    img.className = 'quote-image';
                    inner.appendChild(img);
                } else {
                    var p = document.createElement('p');
                    p.className = 'quote-text';
                    p.textContent = (idiomaActual === 'es') ? item.es : item.en;
                    inner.appendChild(p);
                }

                card.appendChild(inner);
                grid.appendChild(card);
            });

            var esEspañol = (idiomaActual === 'es');
            document.documentElement.lang = esEspañol ? 'es' : 'en';
            document.title = esEspañol ? 'Darrmilly — Despedida' : 'Darrmilly — Farewell';
            document.getElementById('galleryTitle').textContent = esEspañol ? 'DESPEDIDA' : 'FAREWELL';
            document.getElementById('footerCopy').textContent = esEspañol
                ? 'TODOS LOS DERECHOS RESERVADOS / 2026'
                : 'ALL RIGHTS RESERVED / 2026';

            document.getElementById('btnEn').classList.toggle('active', !esEspañol);
            document.getElementById('btnEs').classList.toggle('active', esEspañol);
        }

        function cambiarIdioma(lang) {
            idiomaActual = lang;
            try {
                localStorage.setItem('darrmilly_lang', lang);
            } catch (e) {}
            renderizarDespedida();
        }

        renderizarDespedida();
    </script>

</body>
</html>
