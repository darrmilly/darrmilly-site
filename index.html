<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darrmilly — Quotes, Design &amp; Soft Music</title>
    <meta name="description" content="Darrmilly — Born from a once-in-a-lifetime love: quotes, design, and soft music for rest, study, meditation, and calm.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F6EFE6;
            font-family: 'Lora', serif;
            color: #7A1212;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .wave-banner {
            position: relative;
            width: 100%;
            max-width: 900px;
            min-height: 205px;
            background-image: url("banner-ola.png");
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px 20px 44px;
        }

        .banner-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .banner-title {
            color: #E3B64E;
            font-size: clamp(1.25rem, 3vw, 2.1rem);
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        }

        .banner-logo {
            width: 92px;
            max-width: 28%;
            height: auto;
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
        }

        .lang-bar-below {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 12px 24px 4px;
        }

        .lang-btn {
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            padding: 5px 15px;
            border-radius: 999px;
            border: 1.5px solid #7A1212;
            background-color: transparent;
            color: #7A1212;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active,
        .lang-btn:hover {
            background-color: #7A1212;
            color: #E2B857;
        }

        .main-content {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 18px 34px;
        }

        .center-art {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 8px 0 20px;
        }

        .hero-illustration {
            width: 225px;
            max-width: 70%;
            height: auto;
            display: block;
        }

        .signature {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .by-circle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: #7A1212;
            color: #E3B64E;
            font-style: italic;
            font-size: 1.15rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .author {
            font-size: 1.45rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #7A1212;
            line-height: 1.2;
        }

        .role {
            font-size: 1rem;
            color: #7A1212;
            line-height: 1.3;
        }

        .explore-wrap {
            margin-top: 20px;
            text-align: center;
        }

        .explore-link {
            display: inline-block;
            color: #7A1212;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1.5px solid #C9963B;
            padding: 6px 16px;
            transition: opacity 0.2s ease;
        }
