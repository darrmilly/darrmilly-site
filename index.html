<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarrMilly — Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F6EFE6;
            font-family: 'Lora', serif;
            color: #7A1212;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        .wave-banner {
            width: 100%;
            max-width: 900px;
            min-height: 140px;
            background-image: url("banner-ola.png");
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 20px;
        }

        .banner-logo {
            width: 68px;
            height: auto;
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
        }

        .nav-strip {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px 8px;
            gap: 12px;
        }

        .back-link {
            font-family: 'Lora', serif;
            font-size: 0.98rem;
            font-weight: 600;
            color: #7A1212;
            text-decoration: none;
            padding: 5px 14px;
            border-radius: 999px;
            border: 1.5px solid #7A1212;
            background-color: transparent;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .back-link:hover,
        .back-link:active,
        .back-link.pressed {
            background-color: #7A1212;
            color: #E3B64E;
            border-color: #7A1212;
            transform: scale(0.98);
        }

        .lang-group {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        .lang-btn {
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            padding: 5px 14px;
            border-radius: 999px;
            border: 1.5px solid #7A1212;
            background-color: transparent;
            color: #7A1212;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .lang-btn.active,
        .lang-btn:hover,
        .lang-btn:active {
            background-color: #7A1212;
            color: #E3B64E;
        }

        .gallery-container {
            width: 100%;
            max-width: 720px;
            padding: 18px 20px 52px;
            text-align: center;
        }

        .gallery-title {
            font-size: clamp(1.55rem, 3.2vw, 2.1rem);
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #7A1212;
            margin-bottom: 24px;
        }

        .themes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .theme-button {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 10px 16px;
            border-radius: 999px;
            background-color: #FFFDF9;
            border: 1.5px solid #C9963B;
            box-shadow: 0 2px 6px rgba(122, 18, 18, 0.06);
            color: #7A1212;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-button:hover {
            background-color: #FBF3E4;
            border-color: #7A1212;
            transform: translateY(-1px);
        }

        .theme-button:active,
        .theme-button.pressed {
            background-color: #7A1212;
            color: #E3B64E;
            border-color: #C9963B;
            transform: scale(0.98);
        }

        @media (max-width: 650px) {
            .themes-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .nav-strip {
                padding: 12px 14px 6px;
            }

            .back-link,
            .lang-btn {
                font-size: 0.82rem;
                padding: 4px 11px;
            }

            .theme-button {
                font-size: 0.92rem;
                min-height: 46px;
            }
        }
    </style>
</head>
<body>

    <header class="wave-banner">
        <img src="logo-dm.png" alt="Logo DM" class="banner-logo">
    </header>

    <div class="nav-strip">
        <a href="index.html" class="back-link" id="backBtn">← Back</a>
        <div class="lang-group" role="group" aria-label="Language switcher">
            <button type="button" id="btnEn" class="lang-btn active" onclick="setGalleryLang('en')">English</button>
            <button type="button" id="btnEs" class="lang-btn" onclick="setGalleryLang('es')">Español</button>
        </div>
    </div>

    <main class="gallery-container">
        <h1 class="gallery-title" id="galleryTitle">GALLERY</h1>

        <nav class="themes-grid" aria-label="Quote themes">
            <a href="dedicatorias.html" class="theme-button" data-en="Dedications" data-es="Dedicatorias">Dedications</a>
            <a href="aniversario.html" class="theme-button" data-en="Anniversary" data-es="Aniversario">Anniversary</a>
            <a href="amor.html" class="theme-button" data-en="Love" data-es="Amor">Love</a>
            <a href="motivacion.html" class="theme-button" data-en="Encouragement" data-es="Motivación">Encouragement</a>
            <a href="dolor.html" class="theme-button" data-en="Pain" data-es="Dolor">Pain</a>
            <a href="despedida.html" class="theme-button" data-en="Farewell" data-es="Despedida">Farewell</a>
            <a href="fe.html" class="theme-button" data-en="Faith" data-es="Fe">Faith</a>
            <a href="descansa-en-paz.html" class="theme-button" data-en="Rest in Peace" data-es="Descansa en Paz">Rest in Peace</a>
            <a href="duelo.html" class="theme-button" data-en="Grief" data-es="Duelo">Grief</a>
        </nav>
    </main>

    <script>
        function setGalleryLang(lang) {
            var isEs = (lang === 'es');
            document.documentElement.lang = isEs ? 'es' : 'en';
            document.getElementById('backBtn').textContent = isEs ? '← Volver' : '← Back';
            document.getElementById('galleryTitle').textContent = isEs ? 'GALERÍA' : 'GALLERY';
            document.title = isEs ? 'DarrMilly — Galería' : 'DarrMilly — Gallery';

            document.querySelectorAll('.theme-button').forEach(function (btn) {
                var label = isEs ? btn.getAttribute('data-es') : btn.getAttribute('data-en');
                if (label) btn.textContent = label;
            });

            document.getElementById('btnEn').classList.toggle('active', !isEs);
            document.getElementById('btnEs').classList.toggle('active', isEs);
        }

        document.querySelectorAll('.theme-button, .back-link').forEach(function (el) {
            el.addEventListener('pointerdown', function () {
                el.classList.add('pressed');
            });
            el.addEventListener('pointerup', function () {
                el.classList.remove('pressed');
            });
            el.addEventListener('pointerleave', function () {
                el.classList.remove('pressed');
            });
            el.addEventListener('pointercancel', function () {
                el.classList.remove('pressed');
            });
        });

        window.addEventListener('pageshow', function () {
            document.querySelectorAll('.pressed').forEach(function (el) {
                el.classList.remove('pressed');
            });
        });
    </script>
</body>
</html>
