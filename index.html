<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darrmilly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F6EFE6;
            font-family: 'Lora', serif;
            color: #7A1212;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Barra superior de idiomas */
        .top-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 12px 24px 8px;
        }

        .lang-btn {
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            padding: 5px 15px;
            border-radius: 999px;
            border: 1.5px solid #7A1212;
            background-color: transparent;
            color: #7A1212;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active,
        .lang-btn:hover {
            background-color: #7A1212;
            color: #E2B857;
        }

        /* Banner con ondas en rojo vino y dorado */
        .wave-banner {
            position: relative;
            width: 100%;
            max-width: 900px;
            min-height: 230px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 36px 20px 58px;
        }

        .wave-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .banner-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .banner-title {
            color: #DFB14B;
            font-size: clamp(1.25rem, 3.1vw, 2.25rem);
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 14px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .banner-logo {
            width: 105px;
            max-width: 32%;
            height: auto;
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
        }

        /* Contenedor inferior */
        .main-content {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 48px;
        }

        .center-art {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 18px 0 36px;
        }

        .hero-illustration {
            width: 310px;
            max-width: 78%;
            height: auto;
            display: block;
        }

        .signature {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .by-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #7A1212;
            color: #DFB14B;
            font-style: italic;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .author {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #7A1212;
            line-height: 1.2;
        }

        .role {
            font-size: 1.05rem;
            color: #7A1212;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="top-bar" role="group" aria-label="Language switcher">
        <button type="button" class="lang-btn active" data-lang="en">English</button>
        <button type="button" class="lang-btn" data-lang="es">Español</button>
    </div>

    <header class="wave-banner">
        <!-- Fondo SVG con ondas en rojo vino, dorado y crema -->
        <svg class="wave-bg" viewBox="0 0 900 250" preserveAspectRatio="none" aria-hidden="true">
            <defs>
                <linearGradient id="wineDeep" x1="0%" y1="0%" x2="100%" y2="85%">
                    <stop offset="0%" stop-color="#3E080A" />
                    <stop offset="48%" stop-color="#6F1013" />
                    <stop offset="100%" stop-color="#8B1518" />
                </linearGradient>
                <linearGradient id="wineWave" x1="0%" y1="20%" x2="100%" y2="70%">
                    <stop offset="0%" stop-color="#580C0F" stop-opacity="0.9" />
                    <stop offset="55%" stop-color="#8D181B" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="#4A090B" stop-opacity="0.95" />
                </linearGradient>
                <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#B98A32" />
                    <stop offset="35%" stop-color="#F5DC93" />
                    <stop offset="65%" stop-color="#D4A646" />
                    <stop offset="85%" stop-color="#F7E3A6" />
                    <stop offset="100%" stop-color="#B3822B" />
                </linearGradient>
            </defs>

            <!-- Base crema inferior -->
            <rect width="900" height="250" fill="#EAE0D3" />

            <!-- Sombra suave de onda crema inferior -->
            <path d="M0,185 C260,150 560,175 900,235 L900,250 L0,250 Z" fill="#F6EFE6" />

            <!-- Cuerpo principal guinda con curva inferior -->
            <path d="M0,0 L900,0 L900,228 C640,175 290,215 0,150 Z" fill="url(#wineDeep)" />

            <!-- Onda satinada intermedia -->
            <path d="M0,38 C220,95 540,10 900,72 L900,195 C610,145 310,185 0,112 Z" fill="url(#wineWave)" />

            <!-- Cinta dorada luminosa siguiendo el borde de la ola -->
            <path d="M-10,76 C240,165 560,175 910,234 L910,244 C560,186 240,176 -10,87 Z" fill="url(#goldRibbon)" />
        </svg>

        <div class="banner-content">
            <h1 class="banner-title" id="bannerTitle">WELCOME TO DARRMILLY</h1>
            <img src="logo-dm.png" alt="Logo DM" class="banner-logo">
        </div>
    </header>

    <main class="main-content">
        <section class="center-art">
            <img src="ilustracion.png" alt="Ilustración de mujer en sillón" class="hero-illustration">
        </section>

        <footer class="signature">
            <span class="by-circle" id="byBadge">by</span>
            <div class="signature-text">
                <p class="author">MARIA DUNN</p>
                <p class="role" id="roleText">Visual Quotes &amp; Digital Design</p>
            </div>
        </footer>
    </main>

    <script>
        const translations = {
            en: {
                htmlLang: "en",
                bannerTitle: "WELCOME TO DARRMILLY",
                byBadge: "by",
                roleText: "Visual Quotes & Digital Design"
            },
            es: {
                htmlLang: "es",
                bannerTitle: "WELCOME TO DARRMILLY",
                byBadge: "por",
                roleText: "Frases Visuales y Diseño Digital"
            }
        };

        const buttons = document.querySelectorAll(".lang-btn");
        const bannerTitle = document.getElementById("bannerTitle");
        const byBadge = document.getElementById("byBadge");
        const roleText = document.getElementById("roleText");
        const mainIllustration = document.querySelector(".hero-illustration");

        function setLanguage(lang) {
            const t = translations[lang] || translations.en;
            document.documentElement.lang = t.htmlLang;
            bannerTitle.textContent = t.bannerTitle;
            byBadge.textContent = t.byBadge;
            roleText.textContent = t.roleText;
            mainIllustration.alt = lang === "en"
                ? "Illustration of a woman sitting with a cup"
                : "Ilustración de mujer en sillón";

            buttons.forEach((btn) => {
                btn.classList.toggle("active", btn.dataset.lang === lang);
            });

            try {
                localStorage.setItem("darrmilly_lang", lang);
            } catch (e) {}
        }

        buttons.forEach((btn) => {
            btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
        });

        let savedLang = "en";
        try {
            savedLang = localStorage.getItem("darrmilly_lang") || "en";
        } catch (e) {}
        setLanguage(savedLang);
    </script>

</body>
</html>
