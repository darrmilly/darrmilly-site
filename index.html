
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darrmilly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FCF9F2;
            font-family: 'Lora', serif;
            color: #7A1212;
            display: flex;
            justify-content: center;
            padding: 24px 16px 48px;
        }

        .page {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lang-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 14px;
        }

        .lang-btn {
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1.5px solid #7A1212;
            background-color: transparent;
            color: #7A1212;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active,
        .lang-btn:hover {
            background-color: #7A1212;
            color: #D8AD43;
        }

        .top-banner {
            width: 100%;
            background-color: #7A1212;
            border-radius: 22px;
            padding: 34px 28px 28px;
            text-align: center;
        }

        .banner-title {
            color: #D8AD43;
            font-size: clamp(1.1rem, 2.6vw, 2rem);
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .banner-logo {
            width: 115px;
            max-width: 35%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .center-art {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 44px 0 36px;
        }

        .hero-illustration {
            width: 310px;
            max-width: 78%;
            height: auto;
            display: block;
        }

        .signature {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .by-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #7A1212;
            color: #D8AD43;
            font-style: italic;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .author {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #7A1212;
            line-height: 1.2;
        }

        .role {
            font-size: 1.05rem;
            color: #7A1212;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <main class="page">
        <div class="lang-bar" role="group" aria-label="Language switcher">
            <button type="button" class="lang-btn" data-lang="en">English</button>
            <button type="button" class="lang-btn active" data-lang="es">Español</button>
        </div>

        <header class="top-banner">
            <h1 class="banner-title" id="bannerTitle">WELCOME TO DARRMILLY</h1>
            <img src="logo-dm.png" alt="Logo DM" class="banner-logo">
        </header>

        <section class="center-art">
            <img src="ilustracion.png" alt="Ilustración de mujer en sillón" class="hero-illustration">
        </section>

        <footer class="signature">
            <span class="by-circle" id="byBadge">by</span>
            <div class="signature-text">
                <p class="author">MARIA DUNN</p>
                <p class="role" id="roleText">Visual Quotes &amp; Digital Design</p>
            </div>
        </footer>
    </main>

    <script>
        const translations = {
            es: {
                htmlLang: "es",
                bannerTitle: "BIENVENIDO A DARRMILLY",
                byBadge: "por",
                roleText: "Frases Visuales y Diseño Digital"
            },
            en: {
                htmlLang: "en",
                bannerTitle: "WELCOME TO DARRMILLY",
                byBadge: "by",
                roleText: "Visual Quotes & Digital Design"
            }
        };

        const buttons = document.querySelectorAll(".lang-btn");
        const bannerTitle = document.getElementById("bannerTitle");
        const byBadge = document.getElementById("byBadge");
        const roleText = document.getElementById("roleText");
        const mainIllustration = document.querySelector(".hero-illustration");

        function setLanguage(lang) {
            const t = translations[lang] || translations.es;
            document.documentElement.lang = t.htmlLang;
            bannerTitle.textContent = t.bannerTitle;
            byBadge.textContent = t.byBadge;
            roleText.textContent = t.roleText;
            mainIllustration.alt = lang === "en"
                ? "Illustration of a woman sitting with a cup"
                : "Ilustración de mujer en sillón";

            buttons.forEach((btn) => {
                btn.classList.toggle("active", btn.dataset.lang === lang);
            });

            try {
                localStorage.setItem("darrmilly_lang", lang);
            } catch (e) {}
        }

        buttons.forEach((btn) => {
            btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
        });

        let savedLang = "es";
        try {
            savedLang = localStorage.getItem("darrmilly_lang") || "es";
        } catch (e) {}
        setLanguage(savedLang);
    </script>

</body>
</html>
