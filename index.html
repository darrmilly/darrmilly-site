
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darrmilly — Quotes, Design &amp; Soft Music</title>
    <meta name="description" content="Darrmilly — Born from a once-in-a-lifetime love: quotes, design, and soft music for rest, study, meditation, and calm.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F6EFE6;
            font-family: 'Lora', serif;
            color: #7A1212;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .top-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 12px 24px 8px;
        }

        .lang-btn {
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            padding: 5px 15px;
            border-radius: 999px;
            border: 1.5px solid #7A1212;
            background-color: transparent;
            color: #7A1212;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active,
        .lang-btn:hover {
            background-color: #7A1212;
            color: #E2B857;
        }

        .wave-banner {
            position: relative;
            width: 100%;
            max-width: 900px;
            min-height: 230px;
            background-image: url("banner-ola.png");
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 20px 52px;
        }

        .banner-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .banner-title {
            color: #E3B64E;
            font-size: clamp(1.25rem, 3.1vw, 2.2rem);
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        }

        .banner-logo {
            width: 100px;
            max-width: 30%;
            height: auto;
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
        }

        .main-content {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 48px;
        }

        .center-art {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 18px 0 36px;
        }

        .hero-illustration {
            width: 310px;
            max-width: 78%;
            height: auto;
            display: block;
        }

        .signature {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .by-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #7A1212;
            color: #E3B64E;
            font-style: italic;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .author {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #7A1212;
            line-height: 1.2;
        }

        .role {
            font-size: 1.05rem;
            color: #7A1212;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="top-bar" role="group" aria-label="Language switcher">
        <button type="button" id="btnEn" class="lang-btn active" onclick="cambiarIdioma('en')">English</button>
        <button type="button" id="btnEs" class="lang-btn" onclick="cambiarIdioma('es')">Español</button>
    </div>

    <header class="wave-banner">
        <div class="banner-content">
            <h1 class="banner-title" id="bannerTitle">WELCOME TO DARRMILLY</h1>
            <img src="logo-dm.png" alt="Logo DM" class="banner-logo">
        </div>
    </header>

    <main class="main-content">
        <section class="center-art">
            <img src="ilustracion.png" id="mainIllustration" alt="Illustration of a woman sitting with a cup" class="hero-illustration">
        </section>

        <footer class="signature">
            <span class="by-circle" id="byBadge">by</span>
            <div class="signature-text">
                <p class="author">MARIA DUNN</p>
                <p class="role" id="roleText">Quotes, Design &amp; Soft Music</p>
            </div>
        </footer>
    </main>

    <script>
        function cambiarIdioma(lang) {
            var esEspañol = (lang === 'es');

            document.documentElement.lang = esEspañol ? 'es' : 'en';
            document.getElementById('bannerTitle').textContent = esEspañol
                ? 'BIENVENIDO A DARRMILLY'
                : 'WELCOME TO DARRMILLY';
            document.getElementById('byBadge').textContent = esEspañol ? 'por' : 'by';
            document.getElementById('roleText').textContent = esEspañol
                ? 'Frases, Diseño y Música Suave'
                : 'Quotes, Design & Soft Music';
            document.getElementById('mainIllustration').alt = esEspañol
                ? 'Ilustración de mujer en sillón con taza'
                : 'Illustration of a woman sitting with a cup';

            document.getElementById('btnEn').classList.toggle('active', !esEspañol);
            document.getElementById('btnEs').classList.toggle('active', esEspañol);

            try {
                localStorage.setItem('darrmilly_lang', lang);
            } catch (e) {}
        }

        try {
            var guardado = localStorage.getItem('darrmilly_lang');
            if (guardado === 'es' || guardado === 'en') {
                cambiarIdioma(guardado);
            }
        } catch (e) {}
    </script>
<div style="margin-top: 28px; text-align: center;">
    <a href="gallery.html" id="irGaleria" style="color: #7A1212; font-weight: 600; text-decoration: none; border-bottom: 1.5px solid #C9963B; padding: 6px 14px;">
        Explore Quotes
    </a>
</div>
</body>
</html>
