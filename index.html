
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darrmilly Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FCF9F2;
            font-family: 'Lora', serif;
            color: #7A1212;
            display: flex;
            justify-content: center;
            padding: 24px 16px 48px;
        }

        .page {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-banner {
            width: 100%;
            background-color: #7A1212;
            border-radius: 22px;
            padding: 34px 28px 28px;
            text-align: center;
        }

        .banner-title {
            color: #D8AD43;
            font-size: clamp(1.1rem, 2.6vw, 2rem);
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .banner-logo {
            width: 115px;
            max-width: 35%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .center-art {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 44px 0 36px;
        }

        .hero-illustration {
            width: 310px;
            max-width: 78%;
            height: auto;
            display: block;
        }

        .signature {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .by-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #7A1212;
            color: #D8AD43;
            font-style: italic;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .author {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #7A1212;
            line-height: 1.2;
        }

        .role {
            font-size: 1.05rem;
            color: #7A1212;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <main class="page">
        <header class="top-banner">
            <h1 class="banner-title">WELCOME TO DARRMILLY STUDIO</h1>
            <img src="logo-dm.png" alt="Logo DM" class="banner-logo">
        </header>

        <section class="center-art">
            <img src="ilustracion.png" alt="Ilustración de mujer en sillón" class="hero-illustration">
        </section>

        <footer class="signature">
            <span class="by-circle">by</span>
            <div class="signature-text">
                <p class="author">MARIA DUNN</p>
                <p class="role">Visual Quotes &amp; Digital Design</p>
            </div>
        </footer>
    </main>

</body>
</html>
