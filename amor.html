<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarrMilly — Calm in the Chaos</title>
    <meta name="description" content="DarrMilly — Calm in the Chaos. Quotes on love, pain, farewell, encouragement, and faith.">

    <!-- Vista previa para redes sociales y mensajería -->
    <meta property="og:title" content="DarrMilly — Calm in the Chaos" />
    <meta property="og:description" content="Quotes on love, pain, farewell, encouragement, and faith." />
    <meta property="og:image" content="https://www.darrmilly.com/portada-darrmilly.png" />
    <meta property="og:url" content="https://www.darrmilly.com/" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FAF5F8;
            font-family: 'Lora', serif;
            color: #6E3B82;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .wave-banner {
            position: relative;
            width: 100%;
            max-width: 900px;
            min-height: 145px;
            background-image: url("banner-ola.png");
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 20px 28px;
        }

        .banner-logo-link {
            display: inline-block;
            text-decoration: none;
        }

        .banner-logo {
            width: 82px;
            height: auto;
            display: block;
            filter: drop-shadow(0 2px 6px rgba(110, 59, 130, 0.3));
        }

        .gallery-container {
            width: 100%;
            max-width: 820px;
            padding: 14px 24px 42px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .lang-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            margin-bottom: 6px;
        }

        .lang-btn {
            background: none;
            border: none;
            font-family: 'Lora', serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #6E3B82;
            cursor: pointer;
            padding: 4px 6px;
            border-bottom: 2px solid transparent;
            transition: opacity 0.2s ease, border-color 0.2s ease;
        }

        .lang-btn:hover {
            opacity: 0.75;
        }

        .lang-btn.active {
            border-bottom-color: #C9962B;
        }

        .gallery-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(2.2rem, 4.8vw, 3rem);
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #6E3B82;
            text-align: center;
            margin: 6px 0 32px;
            text-shadow: 0 1px 8px rgba(255, 255, 255, 0.9);
        }

        .quotes-grid {
            width: 100%;
            max-width: 760px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 44px;
        }

        .quote-card {
            position: relative;
            background-color: #7D4694;
            border-radius: 14px;
            padding: 7px 12px;
            display: flex;
            align-items: stretch;
            justify-content: center;
            min-height: 92px;
            box-shadow: 0 4px 14px rgba(110, 59, 130, 0.1);
        }

        .quote-card::before,
        .quote-card::after {
            content: "";
            position: absolute;
            top: 7px;
            bottom: 7px;
            width: 7px;
            background: linear-gradient(180deg, #C9962B 0%, #F1CF7A 50%, #9E7216 100%);
        }

        .quote-card::before {
            left: 4px;
            border-radius: 8px 0 0 8px;
        }

        .quote-card::after {
            right: 4px;
            border-radius: 0 8px 8px 0;
        }

        .quote-inner {
            background-color: #FAF5F8;
            border-radius: 10px;
            width: 100%;
            padding: 14px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .quote-text {
            font-size: 1.02rem;
            font-weight: 600;
            line-height: 1.45;
            color: #6E3B82;
            white-space: pre-line;
        }

        .share-btn {
            padding: 6px 18px;
            background-color: #E8DDF2;
            color: #6E3B82;
            border: 1.5px solid #C9962B;
            border-radius: 20px;
            font-family: 'Lora', serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .share-btn:hover {
            background-color: #DAC8EC;
            border-color: #9E7216;
            color: #552B67;
        }

        .gallery-footer {
            text-align: center;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #7D4694;
            margin-top: auto;
            padding-top: 12px;
        }

        @media (max-width: 700px) {
            .wave-banner {
                min-height: 115px;
                padding: 14px 16px 20px;
            }

            .banner-logo {
                width: 68px;
            }

            .gallery-container {
                padding: 12px 18px 34px;
            }

            .lang-bar {
                justify-content: center;
                margin-bottom: 10px;
            }

            .gallery-title {
                margin: 4px 0 24px;
            }

            .quotes-grid {
                gap: 16px;
                margin-bottom: 34px;
            }

            .quote-card {
                min-height: 82px;
            }

            .quote-inner {
                padding: 12px 16px;
            }

            .quote-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <header class="wave-banner">
        <a href="index.html" class="banner-logo-link" title="Back to Home">
            <img src="logo-dm.png" alt="Logo DM" class="banner-logo">
        </a>
    </header>

    <main class="gallery-container">
        <div class="lang-bar" role="group" aria-label="Language switcher">
            <button type="button" id="btnEn" class="lang-btn active" onclick="cambiarIdioma('en')">English</button>
            <button type="button" id="btnEs" class="lang-btn" onclick="cambiarIdioma('es')">Español</button>
        </div>

        <h1 class="gallery-title" id="galleryTitle">LOVE</h1>

        <section class="quotes-grid" id="quotesGrid" aria-live="polite"></section>

        <footer class="gallery-footer" id="footerCopy">
            ALL RIGHTS RESERVED / 2026
        </footer>
    </main>

    <script src="frases-amor.js"></script>
    <script>
        var idiomaActual = 'en';

        try {
            var guardado = localStorage.getItem('darrmilly_lang');
            if (guardado === 'es' || guardado === 'en') {
                idiomaActual = guardado;
            }
        } catch (e) {}

        async function compartirFrase(quoteText, url, esEspañol) {
            var message = '"' + quoteText + '" — DarrMilly:';

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'DarrMilly',
                        text: message,
                        url: url
                    });
                } catch (err) {
                    // Si el usuario cierra el menú, no se muestra error
                }
            } else {
                var fallbackText = message + ' ' + url;
                try {
                    await navigator.clipboard.writeText(fallbackText);
                    alert(esEspañol
                        ? 'Se copió la frase con el enlace para compartir.'
                        : 'Quote and link copied to clipboard to share.');
                } catch (err) {
                    alert(esEspañol
                        ? 'No se pudo copiar automáticamente.'
                        : 'Could not copy automatically.');
                }
            }
        }

        function renderizarAmor() {
            var lista = (typeof frasesAmor !== 'undefined') ? frasesAmor : [];
            var grid = document.getElementById('quotesGrid');
            var esEspañol = (idiomaActual === 'es');
            var shareUrl = 'https://www.darrmilly.com/#love';

            grid.innerHTML = '';

            lista.forEach(function(item) {
                var textoFrase = esEspañol ? item.es : item.en;

                var card = document.createElement('article');
                card.className = 'quote-card';

                var inner = document.createElement('div');
                inner.className = 'quote-inner';

                var p = document.createElement('p');
                p.className = 'quote-text';
                p.textContent = textoFrase;
                inner.appendChild(p);

                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'share-btn';
                btn.textContent = esEspañol ? 'Compartir' : 'Share';
                btn.addEventListener('click', function() {
                    compartirFrase(textoFrase, shareUrl, esEspañol);
                });
                inner.appendChild(btn);

                card.appendChild(inner);
                grid.appendChild(card);
            });

            document.documentElement.lang = esEspañol ? 'es' : 'en';
            document.title = esEspañol ? 'DarrMilly — Calm in the Chaos' : 'DarrMilly — Calm in the Chaos';
            document.getElementById('galleryTitle').textContent = esEspañol ? 'AMOR' : 'LOVE';
            document.getElementById('footerCopy').textContent = esEspañol
                ? 'TODOS LOS DERECHOS RESERVADOS / 2026'
                : 'ALL RIGHTS RESERVED / 2026';

            document.getElementById('btnEn').classList.toggle('active', !esEspañol);
            document.getElementById('btnEs').classList.toggle('active', esEspañol);
        }

        function cambiarIdioma(lang) {
            idiomaActual = lang;
            try {
                localStorage.setItem('darrmilly_lang', lang);
            } catch (e) {}
            renderizarAmor();
        }

        renderizarAmor();
    </script>

</body>
</html>
